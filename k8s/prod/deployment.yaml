apiVersion: apps/v1
kind: Deployment
metadata:
  name: rick-morty-frontend
  namespace: rick-morty
  labels:
    app: rick-morty-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rick-morty-frontend
  template:
    metadata:
      labels:
        app: rick-morty-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: rick-morty-frontend
          image: registry.welt-on.com/rick-morty-frontend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4008
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4008"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Server-side fetches go straight to the backend Service inside the cluster
            - name: API_URL
              value: "http://rick-morty-backend.rick-morty.svc.cluster.local"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.rick-morty.welt-on.com"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 4008
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4008
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      imagePullSecrets:
        - name: registry-secret
